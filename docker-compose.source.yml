services:
  postgres:
    image: postgres:16-alpine
    container_name: flvx-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?set POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      TZ: ${TZ:-Asia/Shanghai}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - flvx-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  backend:
    build:
      context: ./go-backend
      dockerfile: Dockerfile
    container_name: flvx-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_TYPE: postgres
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      SERVER_ADDR: :6365
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${BACKEND_PORT:-6365}:6365"
    networks:
      - flvx-network
    stop_grace_period: 30s
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "sh", "-c", "wget --no-verbose --tries=1 --spider http://localhost:6365/flow/test || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 8
      start_period: 45s

  frontend:
    build:
      context: ./vite-frontend
      dockerfile: Dockerfile
    container_name: flvx-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-6366}:80"
    volumes:
      - "${AGENT_ASSET_DIR:-./agent}:/usr/share/nginx/html/agent:ro"
    networks:
      - flvx-network

volumes:
  postgres_data:
    name: flvx_postgres_data

networks:
  flvx-network:
    name: flvx-network
    driver: bridge
